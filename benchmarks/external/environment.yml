# R and the R packages of the benchmarks' "(R)" configurations, from
# conda-forge, at the versions the published results were measured with:
#
#   micromamba create -p benchmarks/external/.r -f benchmarks/external/environment.yml
#
# (or conda/mamba with the same arguments). See benchmarks/README.md.
name: logit-stream-benchmarks-r
channels:
  - conda-forge
dependencies:
  - r-base=4.5.3
  - r-arrow=25.0.0
  - r-jsonlite=2.0.0
  - r-fixest=0.14.2         # glm with fixed effects (feglm)
  - r-alpaca=0.3.5          # feglm with biasCorr, the incidental-parameter correction
  - r-nnet=7.3_21           # multinom
  - r-mass=7.3_66           # polr
  - r-ordinal=2026.7_26     # clm
  - r-survival=3.8_12       # clogit
  - r-mlogit=2.0_0          # conditional and nested logit
  - r-dfidx=0.2_0
  - r-logitr=1.1.3          # mixed logit
